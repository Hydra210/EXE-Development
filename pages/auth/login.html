<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — EXE Development</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #120d0a;
    --bg-deep: #090707;
    --panel: rgba(22, 18, 15, 0.88);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #f5ede1;
    --text-muted: rgba(245, 237, 225, 0.7);
    --accent: #b794f6;
    --accent-soft: rgba(155, 111, 245, 0.16);
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.12);
  }

  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
      repeating-linear-gradient(91deg, rgba(0,0,0,0.12) 0px, transparent 1.5px, transparent 3px, rgba(255,255,255,0.02) 4px, transparent 6px, transparent 14px),
      repeating-linear-gradient(91deg, transparent 0px, rgba(0,0,0,0.14) 60px, transparent 62px, transparent 140px),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: none;
    pointer-events: none;
  }

  a { color: inherit; text-decoration: none; }

  .auth-shell {
    width: min(520px, calc(100% - 48px));
    position: relative;
  }

  .auth-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 32px;
    padding: 44px 36px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(18px);
    overflow: hidden;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%);
    pointer-events: none;
  }

  .auth-brand {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 16px;
    margin-bottom: 34px;
  }

  .auth-logo {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--text);
  }

  .auth-logo-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
  }

  .auth-logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .auth-logo-mark svg {
    width: 20px;
    height: 20px;
    stroke: var(--accent);
    display: none;
  }

  .auth-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 4vw, 40px);
    line-height: 1.05;
  }

  .auth-copy {
    color: var(--text-muted);
    line-height: 1.75;
    max-width: 95%;
  }

  .auth-form {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 18px;
    margin-bottom: 28px;
  }

  .form-field {
    display: grid;
    gap: 10px;
  }

  .form-field label {
    font-size: 14px;
    color: var(--text-muted);
  }

  .form-field input {
    width: 100%;
    border: 1px solid var(--input-border);
    border-radius: 16px;
    background: var(--input-bg);
    color: var(--text);
    padding: 16px 18px;
    font-size: 15px;
    outline: none;
  }

  .form-field input::placeholder {
    color: rgba(245,237,225,0.42);
  }

  .auth-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    color: var(--text-muted);
    font-size: 14px;
  }

  .checkbox-field {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }

  .checkbox-field input {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
  }

  .auth-link {
    color: var(--accent);
  }

  .btn-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    border: none;
    border-radius: 100px;
    padding: 16px 24px;
    background: linear-gradient(155deg, #b794f6, #7c3aed);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 34px rgba(139,92,246,0.25);
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-link-reset {
    display: block;
    width: 100%;
    text-align: center;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 14px;
    cursor: pointer;
    padding: 0;
  }
  .btn-link-reset:hover { color: var(--accent); }

  .auth-status {
    display: none;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .auth-status.active { display: block; }
  .auth-status.error {
    background: rgba(247, 118, 118, 0.12);
    border: 1px solid rgba(247, 118, 118, 0.28);
    color: #f7b6b6;
  }
  .auth-status.success {
    background: rgba(126, 232, 154, 0.1);
    border: 1px solid rgba(126, 232, 154, 0.28);
    color: #b7f0c6;
  }
  .auth-status.info {
    background: rgba(183, 148, 246, 0.1);
    border: 1px solid rgba(183, 148, 246, 0.28);
    color: #d9c8f7;
  }

  .auth-secondary {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 12px;
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
  }

  .auth-secondary a { color: var(--accent); }

  .page-transition {
    position: fixed; inset: 0; z-index: 9999; pointer-events: none;
    background: radial-gradient(circle at center, rgba(183,148,246,0.16), rgba(18,13,10,0.96));
    opacity: 0; transition: opacity 320ms ease;
  }
  .page-transition.is-visible { opacity: 1; }

  .reveal {
    opacity: 0;
    transform: translateY(18px) scale(0.985);
    transition: opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1);
  }
  .reveal.is-visible { opacity: 1; transform: translateY(0) scale(1); }

  body { opacity: 1; transition: opacity 320ms ease; }
  body.page-enter { opacity: 1; }
  body.page-exit { opacity: 0; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal, .page-transition, body { transition: none !important; }
  }

  .auth-footer {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    color: var(--text-muted);
    font-size: 13px;
  }

  .circle-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .glow-1 {
    width: 220px;
    height: 220px;
    top: -50px;
    right: -50px;
    background: transparent;
    filter: blur(0);
  }

  .glow-2 {
    width: 180px;
    height: 180px;
    bottom: -70px;
    left: -50px;
    background: transparent;
    filter: blur(0);
  }

  @media (max-width: 520px) {
    .auth-card { padding: 32px 22px; }
    .auth-form { gap: 16px; }
    .auth-meta { flex-direction: column; align-items: flex-start; }
    .auth-footer { gap: 14px; }
  }
</style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">

      <div class="auth-brand">
        <a href="/" class="auth-logo">
          <span class="auth-logo-mark">
            <img src="/static/assets/logo/logo-mini.png" alt="EXE" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/></svg>
          </span>
          EXE Development
        </a>
        <div>
          <h1 class="auth-title" id="authTitle">Sign in to your account</h1>
          <p class="auth-copy" id="authCopy">Access your projects, settings, and workspace tools.</p>
        </div>
      </div>

      <div class="auth-status" id="authStatus" role="alert" aria-live="polite"></div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <div class="auth-meta">
          <span></span>
          <a class="auth-link" href="/auth/forgot-password">Forgot password?</a>
        </div>
        <button type="submit" class="btn-submit" id="loginSubmit">Sign in</button>
      </form>

      <form class="auth-form" id="twofaForm" novalidate style="display:none;">
        <div class="form-field">
          <label for="code">6-digit code</label>
          <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
        </div>
        <button type="submit" class="btn-submit" id="twofaSubmit">Verify and sign in</button>
        <button type="button" class="btn-link-reset" id="twofaBack">← Use a different account</button>
      </form>

      <div class="auth-secondary" id="loginSecondary">
        <p>Don’t have an account yet? <a href="/auth/signup">Create account</a></p>
        <p><a href="/">Return to EXE</a></p>
      </div>

      <div class="auth-footer">
        <span><a href="/legal/privacy">Privacy</a></span>
        <span><a href="/legal/terms">Terms</a></span>
        <span><a href="/legal/support">Support</a></span>
      </div>
    </div>
  </main>
  <div class="page-transition" aria-hidden="true"></div>
  <script>
    document.body.classList.add('page-enter');
    const transitionOverlay = document.querySelector('.page-transition');
    const revealTargets = document.querySelectorAll('.auth-shell, .auth-card, .auth-brand, .auth-form, .auth-secondary, .auth-footer');

    revealTargets.forEach((el, index) => {
      el.classList.add('reveal');
      el.style.transitionDelay = `${index * 70}ms`;
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    revealTargets.forEach((el) => revealObserver.observe(el));

    document.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href') || '';
      const isLocal = href && !href.startsWith('http') && !href.startsWith('mailto:') && !href.startsWith('tel:') && !href.startsWith('#') && !href.startsWith('javascript:') && !link.hasAttribute('target');
      if (!isLocal) return;
      link.addEventListener('click', (event) => {
        event.preventDefault();
        document.body.classList.add('page-exit');
        transitionOverlay.classList.add('is-visible');
        setTimeout(() => { window.location.href = href; }, 260);
      });
    });
  </script>
  <script>
    // ── Login + 2FA wiring ──────────────────────────────────────────────
    // Talks to this site's own /api/auth/* endpoints (same origin) — never
    // calls the Accounts API directly from the browser. The backend sets
    // httpOnly session cookies on success, so no tokens ever touch this JS.
    const statusEl = document.getElementById('authStatus');
    const loginForm = document.getElementById('loginForm');
    const loginSubmit = document.getElementById('loginSubmit');
    const twofaForm = document.getElementById('twofaForm');
    const twofaSubmit = document.getElementById('twofaSubmit');
    const twofaBack = document.getElementById('twofaBack');
    const loginSecondary = document.getElementById('loginSecondary');
    const authTitle = document.getElementById('authTitle');
    const authCopy = document.getElementById('authCopy');

    let pendingChallengeToken = null;

    function showStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = 'auth-status active ' + kind;
    }
    function clearStatus() {
      statusEl.className = 'auth-status';
      statusEl.textContent = '';
    }

    function showTwofaStep() {
      loginForm.style.display = 'none';
      loginSecondary.style.display = 'none';
      twofaForm.style.display = 'grid';
      authTitle.textContent = 'Check your email';
      authCopy.textContent = 'Enter the 6-digit code we just sent you to finish signing in.';
      document.getElementById('code').focus();
    }
    function showLoginStep() {
      pendingChallengeToken = null;
      twofaForm.style.display = 'none';
      loginForm.style.display = 'grid';
      loginSecondary.style.display = 'grid';
      authTitle.textContent = 'Sign in to your account';
      authCopy.textContent = 'Access your projects, settings, and workspace tools.';
      clearStatus();
    }

    // If a session cookie already checks out, skip straight past the login form.
    fetch('/api/auth/session').then(r => r.json()).then(data => {
      if (data && data.user) window.location.href = '/';
    }).catch(() => {});

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();
      loginSubmit.disabled = true;
      loginSubmit.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Something went wrong. Try again');

        if (data.requires_2fa) {
          pendingChallengeToken = data.challenge_token;
          showTwofaStep();
        } else {
          window.location.href = '/';
        }
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.textContent = 'Sign in';
      }
    });

    twofaForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearStatus();
      const code = document.getElementById('code').value.trim();
      if (!pendingChallengeToken || code.length !== 6) {
        showStatus('Enter the 6-digit code from your email', 'error');
        return;
      }
      twofaSubmit.disabled = true;
      twofaSubmit.textContent = 'Verifying…';
      try {
        const res = await fetch('/api/auth/verify-2fa', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ challenge_token: pendingChallengeToken, code }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Incorrect or expired code');
        window.location.href = '/';
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        twofaSubmit.disabled = false;
        twofaSubmit.textContent = 'Verify and sign in';
      }
    });

    twofaBack.addEventListener('click', showLoginStep);
  </script>
</body>
</html>
