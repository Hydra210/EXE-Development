<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password — EXE Development</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #120d0a;
    --panel: rgba(22, 18, 15, 0.88);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #f5ede1;
    --text-muted: rgba(245, 237, 225, 0.7);
    --accent: #b794f6;
    --input-bg: rgba(255,255,255,0.05);
    --input-border: rgba(255,255,255,0.12);
  }

  html { scroll-behavior: smooth; }
  body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background:
      repeating-linear-gradient(91deg, rgba(0,0,0,0.12) 0px, transparent 1.5px, transparent 3px, rgba(255,255,255,0.02) 4px, transparent 6px, transparent 14px),
      repeating-linear-gradient(91deg, transparent 0px, rgba(0,0,0,0.14) 60px, transparent 62px, transparent 140px),
      var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: none;
    pointer-events: none;
  }

  a { color: inherit; text-decoration: none; }

  .auth-shell {
    width: min(520px, calc(100% - 48px));
    position: relative;
  }

  .auth-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 32px;
    padding: 44px 36px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(18px);
    overflow: hidden;
  }

  .auth-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent 40%);
    pointer-events: none;
  }

  .auth-brand {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 16px;
    margin-bottom: 34px;
  }

  .auth-logo {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--text);
  }

  .auth-logo-mark {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
  }

  .auth-logo-mark img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .auth-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(32px, 4vw, 40px);
    line-height: 1.05;
  }

  .auth-copy {
    color: var(--text-muted);
    line-height: 1.75;
    max-width: 95%;
  }

  .auth-form {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 18px;
    margin-bottom: 28px;
  }

  .form-field {
    display: grid;
    gap: 10px;
  }

  .form-field label {
    font-size: 14px;
    color: var(--text-muted);
  }

  .form-field input {
    width: 100%;
    border: 1px solid var(--input-border);
    border-radius: 16px;
    background: var(--input-bg);
    color: var(--text);
    padding: 16px 18px;
    font-size: 15px;
    outline: none;
  }

  .form-field input::placeholder {
    color: rgba(245,237,225,0.42);
  }

  .btn-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    border: none;
    border-radius: 100px;
    padding: 16px 24px;
    background: linear-gradient(155deg, #b794f6, #7c3aed);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-submit:hover {
    transform: translateY(-1px);
    box-shadow: 0 14px 34px rgba(139,92,246,0.25);
  }

  .btn-submit:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .auth-status {
    display: none;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .auth-status.active { display: block; }
  .auth-status.error {
    background: rgba(247, 118, 118, 0.12);
    border: 1px solid rgba(247, 118, 118, 0.28);
    color: #f7b6b6;
  }
  .auth-status.success {
    background: rgba(126, 232, 154, 0.1);
    border: 1px solid rgba(126, 232, 154, 0.28);
    color: #b7f0c6;
  }

  .auth-secondary {
    position: relative;
    z-index: 1;
    display: grid;
    gap: 12px;
    margin-top: 8px;
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
  }

  .auth-secondary a { color: var(--accent); }

  .circle-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }

  .glow-1 {
    width: 220px;
    height: 220px;
    top: -50px;
    right: -50px;
    background: transparent;
    filter: blur(0);
  }

  .glow-2 {
    width: 180px;
    height: 180px;
    bottom: -70px;
    left: -50px;
    background: transparent;
    filter: blur(0);
  }

  @media (max-width: 520px) {
    .auth-card { padding: 32px 22px; }
    .auth-form { gap: 16px; }
    .auth-secondary { gap: 10px; }
  }
</style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">

      <div class="auth-brand">
        <a href="/auth/login" class="auth-logo">
          <span class="auth-logo-mark">
            <img src="/static/assets/logo/logo-mini.png" alt="EXE" onerror="this.style.display='none';">
          </span>
          EXE Development
        </a>
        <div>
          <h1 class="auth-title" id="authTitle">Reset your password</h1>
          <p class="auth-copy" id="authCopy">Enter the email you used for your EXE account and we’ll send a reset link so you can get back in quickly.</p>
        </div>
      </div>

      <div class="auth-status" id="authStatus" role="alert" aria-live="polite"></div>

      <form class="auth-form" id="forgotForm" novalidate>
        <div class="form-field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn-submit" id="forgotSubmit">Send reset link</button>
      </form>

      <div class="auth-secondary" id="forgotSecondary">
        <p>Remembered your password? <a href="/auth/login">Sign in</a></p>
        <p><a href="/">Return to EXE</a></p>
      </div>
    </div>
  </main>
  <div class="page-transition" aria-hidden="true"></div>
  <script>
    document.body.classList.add('page-enter');
    const transitionOverlay = document.querySelector('.page-transition');
    const revealTargets = document.querySelectorAll('.auth-shell, .auth-card, .auth-brand, .auth-form, .auth-secondary');

    revealTargets.forEach((el, index) => {
      el.classList.add('reveal');
      el.style.transitionDelay = `${index * 70}ms`;
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    revealTargets.forEach((el) => revealObserver.observe(el));

    document.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href') || '';
      const isLocal = href && !href.startsWith('http') && !href.startsWith('mailto:') && !href.startsWith('tel:') && !href.startsWith('#') && !href.startsWith('javascript:') && !link.hasAttribute('target');
      if (!isLocal) return;
      link.addEventListener('click', (event) => {
        event.preventDefault();
        document.body.classList.add('page-exit');
        transitionOverlay.classList.add('is-visible');
        setTimeout(() => { window.location.href = href; }, 260);
      });
    });
  </script>
  <script>
    const statusEl = document.getElementById('authStatus');
    const forgotForm = document.getElementById('forgotForm');
    const forgotSubmit = document.getElementById('forgotSubmit');
    const forgotSecondary = document.getElementById('forgotSecondary');
    const authTitle = document.getElementById('authTitle');
    const authCopy = document.getElementById('authCopy');

    function showStatus(message, kind) {
      statusEl.textContent = message;
      statusEl.className = 'auth-status active ' + kind;
    }

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      forgotSubmit.disabled = true;
      forgotSubmit.textContent = 'Sending…';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Something went wrong. Try again');

        forgotForm.style.display = 'none';
        forgotSecondary.style.display = 'none';
        authTitle.textContent = 'Check your email';
        authCopy.textContent = 'If that email has an EXE account, a reset link is on its way.';
        showStatus('If that email has an account, a reset link was sent.', 'success');
      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        forgotSubmit.disabled = false;
        forgotSubmit.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
