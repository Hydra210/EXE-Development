services:
  - type: web
    name: exe-development-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ACCOUNTS_API_URL
        sync: false   # set this manually to your deployed exe-accounts-api URL
      - key: COOKIE_SECURE
        value: "true"
